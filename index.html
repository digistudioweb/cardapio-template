<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Título e descrição ficam escritos aqui (e não só no JS) porque o Google e a
       prévia de link do WhatsApp leem o HTML sem executar JavaScript. Trocar por cliente. -->
  <title>Brasa &amp; Massa Pizzaria — Cardápio e pedidos</title>
  <meta name="description" content="Cardápio da Brasa &amp; Massa Pizzaria em Ciudad del Este. Escolha sua pizza e peça pelo WhatsApp.">
  <meta name="theme-color" content="#B42318">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="pular" href="#cardapio">Pular para o cardápio</a>

  <header class="topo">
    <img class="topo__capa" src="img/capa.jpg" alt="" width="1600" height="700">
    <div class="topo__info">
      <div class="topo__marca" aria-hidden="true" data-sigla></div>
      <h1 class="topo__nome" data-nome>Brasa &amp; Massa Pizzaria</h1>
      <p class="topo__slogan" data-slogan></p>
      <p class="status" data-status role="status">Verificando horário…</p>
      <ul class="topo__detalhes" data-detalhes role="list"></ul>
    </div>
  </header>

  <nav class="categorias" aria-label="Categorias do cardápio">
    <ul data-categorias role="list"></ul>
  </nav>

  <main id="cardapio" class="cardapio" data-secoes tabindex="-1">
    <p class="carregando">Carregando cardápio…</p>
  </main>

  <footer class="rodape">
    <p class="rodape__creditos" data-creditos></p>
    <p class="rodape__assinatura">
      Feito por <a href="https://instagram.com/digistudio.web" target="_blank" rel="noopener">Digi Studio</a>
    </p>
  </footer>

  <!-- Barra fixa do carrinho: só aparece com pelo menos 1 item. -->
  <div class="barra-carrinho" data-barra-carrinho hidden>
    <p class="aviso" data-aviso role="status"></p>
    <button type="button" class="botao-primario barra-carrinho__botao" data-abrir-carrinho aria-haspopup="dialog">
      <span class="barra-carrinho__qtd" data-carrinho-qtd>0 itens</span>
      <span>Ver carrinho</span>
      <span data-carrinho-total>R$ 0,00</span>
    </button>
  </div>

  <!-- Painel do item: o conteúdo é montado por js/ui-item.js a cada item aberto. -->
  <dialog class="painel" data-painel-item aria-labelledby="painel-item-titulo"></dialog>

  <!-- Painel do carrinho: a lista é montada por js/ui-carrinho.js. -->
  <dialog class="painel" data-painel-carrinho aria-labelledby="carrinho-titulo">
    <div class="painel__form">
      <button type="button" class="painel__fechar" data-acao="fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <div class="painel__corpo">
        <div class="painel__intro">
          <h2 class="painel__titulo" id="carrinho-titulo" tabindex="-1" autofocus>Seu pedido</h2>
        </div>
        <ul class="linhas" data-linhas role="list"></ul>
        <p class="carrinho-vazio" data-vazio>Seu carrinho está vazio. Escolha algo no cardápio.</p>
      </div>
      <div class="painel__rodape painel__rodape--resumo" data-resumo>
        <div class="resumo__linha">
          <span>Subtotal</span>
          <strong data-subtotal>R$ 0,00</strong>
        </div>
        <p class="resumo__nota" data-nota-entrega></p>
        <div class="resumo__botoes">
          <button type="button" class="botao-secundario" data-acao="fechar">Adicionar mais itens</button>
          <button type="button" class="botao-primario" data-acao="continuar" data-continuar>Continuar</button>
        </div>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="aviso-erro">Este cardápio precisa de JavaScript ativado para funcionar.</p>
  </noscript>
</body>
</html>
